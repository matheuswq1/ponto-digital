name: ponto_app
description: RM Colaboradores — Gestão de pessoas
publish_to: 'none'
version: 1.0.0+1

environment:
  # flutter_secure_storage ^10 exige Dart >=3.3
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  package_info_plus: ^8.1.2

  # Armazenamento local
  shared_preferences: ^2.3.4
  sqflite: ^2.4.2
  path: ^1.9.1

  # Câmera e mídia
  camera: ^0.11.1
  image: ^4.5.4

  # GPS / Localização
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # Wi-Fi (SSID para anti-fraude). 8.x puxa win32 ^6 e conflita com flutter_secure_storage ^10.
  network_info_plus: ^7.0.0

  # Navegação
  go_router: ^14.8.1

  # UI
  intl: ^0.20.2

  # Push notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Utilitários
  uuid: ^4.5.3

  # Ícones
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.1
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.10.0
  # >=9.x declara namespace no Android (AGP 8+); 4.x quebra assembleDebug
  flutter_secure_storage: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/animations/
    - assets/icons/
